#:schema https://supabase.com/schemas/config/v1.json
project_id = "Recallio"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/confirm",
  "http://127.0.0.1:3210/auth/confirm",
  "http://127.0.0.1:3211/auth/confirm",
]
enable_anonymous_sign_ins = false

[auth.email]
enabled = true
enable_confirmations = true
secure_password_change = true

[auth.email.template.confirmation]
subject = "Potwierdź konto Recallio"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Odzyskaj hasło do Recallio"
content_path = "./supabase/templates/recovery.html"
